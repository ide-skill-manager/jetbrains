name: Verify Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  verify:
    permissions:
      contents: read
    name: Verify plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Single job; the IDE matrix lives in build.gradle.kts under
      # `pluginVerification.ides {}` and Gradle runs every entry in one
      # `verifyPlugin` invocation. The previous per-IDE GitHub matrix passed
      # `-Pplugin.verifier.ide.versions=` which is a legacy `gradle-intellij-plugin`
      # 1.x property — the 2.x `intellij-platform-gradle-plugin` we use ignores it,
      # so each matrix job redundantly verified the whole set.
      - name: Verify plugin
        run: ./gradlew verifyPlugin
