name: Verify Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  verify:
    permissions:
      contents: read
    name: Verify on ${{ matrix.ide }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ide:
          - IC-2024.3
          - IC-2024.2
          - IC-2024.1
          - PCC-2024.3
          - WS-2024.3
          - RD-2024.3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin on ${{ matrix.ide }}
        run: ./gradlew verifyPlugin -Pplugin.verifier.ide.versions=${{ matrix.ide }}
